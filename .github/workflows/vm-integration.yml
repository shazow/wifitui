name: VM integration checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  hwsim-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grant KVM access to the Nix build users
        run: |
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: disabled
      - name: Evaluate flake outputs
        run: nix flake check --show-trace --all-systems --no-build
      - name: Run hwsim VM tests
        run: nix build .#checks.x86_64-linux.networkmanager-hwsim .#checks.x86_64-linux.iwd-hwsim --show-trace -L
